<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPI Barkada FUNd</title>
<style>
  :root{
    --red:#A6192E; --red-dark:#7C1121; --cream:#FBF7F1; --paper:#FFFFFF;
    --ink:#241C1B; --ink-soft:#6B615E; --hair:#EAE2DA; --gold:#D9A441;
    --green:#2F7A4D; --green-bg:#E9F3EC;
  }
  *{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
  body{ margin:0; background:#EDE7DE; font-family:'Manrope','Segoe UI',system-ui,sans-serif; color:var(--ink); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:28px 16px; }

  .phone-wrap{ position:relative; }
  .phone{ width:375px; height:812px; background:#0B0B0C; border-radius:52px; padding:14px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.05); }
  .screen{ width:100%; height:100%; background:var(--cream); border-radius:38px; overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .notch{ position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:26px; background:#0B0B0C; border-radius:20px; z-index:20; }
  .statusbar{ height:46px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 26px 8px; font-size:13px; font-weight:700; color:var(--ink); flex-shrink:0; }
  .appbar{ padding:2px 20px 14px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; }
  .appbar .brand{ display:flex; align-items:center; gap:8px; }
  .appbar .logo{ width:26px; height:26px; border-radius:7px; background:var(--red); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800; }
  .appbar .brand-name{ font-size:14px; font-weight:800; letter-spacing:-.01em;}
  .appbar .brand-name span{ color:var(--red); }
  .content{ flex:1; overflow-y:auto; padding:4px 20px 20px; }
  .content::-webkit-scrollbar{display:none;}

  .card{ background:var(--paper); border-radius:18px; padding:18px; border:1px solid var(--hair); margin-bottom:14px; }
  .eyebrow{ font-size:10.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 6px;}
  .h2{ font-size:19px; font-weight:800; letter-spacing:-.01em; margin:0 0 4px;}
  .muted{ color:var(--ink-soft); font-size:12.5px; line-height:1.5; margin:0;}
  .btn{ display:block; width:100%; text-align:center; border:none; cursor:pointer; background:var(--red); color:#fff; font-family:inherit; font-weight:800; font-size:14px; padding:14px; border-radius:14px; letter-spacing:.01em; }
  .btn.secondary{ background:var(--paper); color:var(--red); border:1.5px solid var(--red); }
  .btn.ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--hair); }
  .pill{ display:inline-block; font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--green-bg); color:var(--green); letter-spacing:.03em; }

  .progress-dots{ display:flex; gap:5px; margin-bottom:18px; }
  .progress-dots div{ height:4px; flex:1; background:var(--hair); border-radius:4px;}
  .progress-dots div.done{ background:var(--red); }
  .quiz-q{ font-size:20px; font-weight:800; line-height:1.3; margin:8px 0 20px;}
  .opt{ background:var(--paper); border:1.5px solid var(--hair); border-radius:14px; padding:14px 16px; margin-bottom:10px; font-size:13.5px; font-weight:700; display:flex; align-items:center; justify-content:space-between; }
  .opt.sel{ border-color:var(--red); background:#FDF1F1; color:var(--red-dark); }
  .opt .radio{ width:18px; height:18px; border-radius:50%; border:2px solid var(--hair); flex-shrink:0;}
  .opt.sel .radio{ border-color:var(--red); background:radial-gradient(var(--red) 0 40%, transparent 42%);}

  .path-card{ border:1.5px solid var(--hair); border-radius:16px; padding:14px; margin-bottom:10px; }
  .path-card.chosen{ border-color:var(--gold); background:#FEFAF0; }
  .path-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .path-name{ font-weight:800; font-size:14px; }
  .path-tag{ font-size:10px; font-weight:800; color:var(--ink-soft);}
  .bar-track{ height:6px; background:var(--hair); border-radius:6px; overflow:hidden; margin-top:8px;}
  .bar-fill{ height:100%; border-radius:6px; }

  .barkada-widget{ background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%); border-radius:20px; padding:20px; color:#fff; margin-bottom:14px; position:relative; overflow:hidden; }
  .barkada-widget::after{ content:""; position:absolute; right:-30px; top:-30px; width:120px; height:120px; background:rgba(255,255,255,.08); border-radius:50%; }
  .bw-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .bw-label{ font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; opacity:.8;}
  .bw-goal{ font-size:16px; font-weight:800; margin-top:2px;}
  .avatars{ display:flex; }
  .avatars .av{ width:26px; height:26px; border-radius:50%; border:2px solid var(--red); background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:var(--red-dark); margin-left:-8px; }
  .avatars .av:first-child{ margin-left:0; }
  .bw-amounts{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .bw-current{ font-size:24px; font-weight:800; }
  .bw-target{ font-size:12px; opacity:.85; font-weight:700;}
  .bw-track{ height:8px; background:rgba(255,255,255,.25); border-radius:8px; overflow:hidden;}
  .bw-fill{ height:100%; background:var(--gold); border-radius:8px; }
  .bw-foot{ display:flex; justify-content:space-between; margin-top:10px; font-size:11px; font-weight:700; opacity:.9;}

  .portfolio-card{ display:flex; justify-content:space-between; align-items:center; }
  .portfolio-card .val{ font-size:22px; font-weight:800; }
  .portfolio-card .gain{ color:var(--green); font-size:12px; font-weight:800; }

  .activity-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--hair);}
  .activity-row:first-of-type{ border-top:none; }
  .activity-av{ width:32px; height:32px; border-radius:50%; background:var(--gold); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--red-dark);}
  .activity-text{ font-size:12.5px; font-weight:700; flex:1; }
  .activity-text b{ color:var(--ink); }
  .activity-time{ font-size:10.5px; color:var(--ink-soft); font-weight:700;}

  .tabbar{ display:flex; justify-content:space-around; align-items:center; padding:12px 10px 10px; border-top:1px solid var(--hair); background:var(--paper); flex-shrink:0; }
  .tab{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:9.5px; font-weight:800; color:var(--ink-soft); cursor:pointer;}
  .tab.active{ color:var(--red); }

  .amount-display{ text-align:center; padding:28px 0 18px; }
  .amount-display .cur{ font-size:14px; color:var(--ink-soft); font-weight:700;}
  .amount-display .num{ font-size:44px; font-weight:800; letter-spacing:-.02em;}
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
  .key{ text-align:center; padding:12px 0; font-size:18px; font-weight:800; background:var(--paper); border:1px solid var(--hair); border-radius:12px;}
  .toggle-row{ display:flex; gap:8px; margin-bottom:14px;}
  .toggle-row .t{ flex:1; text-align:center; padding:10px; border-radius:12px; font-size:12px; font-weight:800; border:1.5px solid var(--hair); color:var(--ink-soft);}
  .toggle-row .t.on{ border-color:var(--red); color:var(--red); background:#FDF1F1;}

  .switch-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .switch{ width:38px; height:22px; background:var(--hair); border-radius:20px; position:relative;}
  .switch.on{ background:var(--red); }
  .switch::after{ content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; }
  .switch.on::after{ left:18px; }
  .holding-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--hair); font-size:12.5px;}
  .holding-row:first-of-type{ border-top:none; }
  .holding-name{ font-weight:800; }
  .holding-sub{ color:var(--ink-soft); font-size:10.5px; font-weight:700;}
  .holding-val{ text-align:right; font-weight:800; }
  .holding-gain{ color:var(--green); font-size:10.5px; font-weight:700;}

  .note{ background:#FDF6E8; border:1px solid #F0DFB0; border-radius:12px; padding:12px 14px; font-size:11.5px; color:#8A6A1E; font-weight:700; line-height:1.5; margin-bottom:14px; }
  .icon-btn{ width:32px; height:32px; border-radius:10px; background:var(--paper); border:1px solid var(--hair); display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; }

  /* interactive form bits */
  .field-label{ font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px; }
  .field-label:first-of-type{ margin-top:0; }
  .text-field{ width:100%; border:1.5px solid var(--hair); border-radius:12px; padding:12px 14px; font-family:inherit; font-size:14px; font-weight:700; outline:none; background:var(--paper); }
  .text-field:focus{ border-color:var(--red); }
  .amount-field-wrap{ display:flex; align-items:center; border:1.5px solid var(--hair); border-radius:12px; padding:0 14px; background:var(--paper); }
  .amount-field-wrap span{ font-weight:800; color:var(--ink-soft); font-size:14px; }
  .amount-field-wrap input{ border:none; outline:none; font-family:inherit; font-weight:800; font-size:14px; padding:12px 8px; width:100%; background:transparent; }
  .amount-field-wrap:focus-within{ border-color:var(--red); }
  .timeframe-row{ display:flex; gap:8px; }
  .tf-card{ flex:1; border:1.5px solid var(--hair); border-radius:14px; padding:12px 8px; text-align:center; background:var(--paper); }
  .tf-card.sel{ border-color:var(--red); background:#FDF1F1; }
  .tf-name{ font-size:12.5px; font-weight:800; }
  .tf-sub{ font-size:9.5px; color:var(--ink-soft); font-weight:700; margin-top:2px; }
  .tf-card.sel .tf-sub{ color:var(--red); }
  .goal-preview{ background:linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%); border-radius:16px; padding:16px; color:#fff; margin:16px 0; }
  .goal-preview .gp-label{ font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; opacity:.8;}
  .goal-preview .gp-name{ font-size:17px; font-weight:800; margin:2px 0 6px;}
  .goal-preview .gp-amt{ font-size:12px; font-weight:700; opacity:.9;}

  .invite-box{ background:var(--paper); border:1.5px dashed var(--hair); border-radius:14px; padding:14px; text-align:center; margin-bottom:16px;}
  .invite-code{ font-size:18px; font-weight:800; letter-spacing:.04em; color:var(--red); margin:4px 0 10px;}
  .add-member-row{ display:flex; gap:8px; margin-bottom:14px; }
  .add-member-row .text-field{ flex:1; }
  .add-btn{ background:var(--red); color:#fff; border:none; border-radius:12px; padding:0 16px; font-family:inherit; font-weight:800; font-size:13px; cursor:pointer; }
  .member-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--hair); }
  .member-row:first-of-type{ border-top:none; }
  .member-av{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; flex-shrink:0; }
  .member-name{ flex:1; font-size:13px; font-weight:800; }
  .member-you{ font-size:9.5px; color:var(--ink-soft); font-weight:700; }
  .remove-btn{ width:24px; height:24px; border-radius:50%; border:1px solid var(--hair); background:var(--paper); font-size:12px; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .why-box{ background:#F4EFE6; border-radius:12px; padding:12px 14px; font-size:11.5px; color:var(--ink-soft); line-height:1.55; margin-bottom:16px; }
  .why-box b{ color:var(--ink); }

  .sidebar-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:40; }
  .sidebar-backdrop.open{ opacity:1; pointer-events:auto; }
  .sidebar{ position:absolute; top:0; left:0; bottom:0; width:78%; max-width:280px; background:var(--paper); z-index:50; transform:translateX(-100%); transition:transform .25s ease; display:flex; flex-direction:column; box-shadow:8px 0 24px rgba(0,0,0,.2); }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-head{ display:flex; align-items:center; justify-content:space-between; padding:20px 16px 14px; border-bottom:1px solid var(--hair); flex-shrink:0; }
  .sidebar-head .brand{ display:flex; align-items:center; gap:8px; }
  .sidebar-head .brand-name{ font-size:13.5px; font-weight:800; letter-spacing:-.01em; }
  .sidebar-head .brand-name span{ color:var(--red); }
  .sidebar-nav{ flex:1; overflow-y:auto; padding:10px; }
  .sidebar-item{ display:flex; align-items:center; gap:12px; padding:12px 12px; border-radius:12px; font-size:13px; font-weight:800; color:var(--ink-soft); cursor:pointer; margin-bottom:2px; transition:.15s; }
  .sidebar-item .si-icon{ font-size:16px; width:20px; text-align:center; }
  .sidebar-item:hover{ background:var(--cream); }
  .sidebar-item.active{ background:#FDF1F1; color:var(--red); }
</style>
</head>
<body>

<div class="phone-wrap">
  <div class="phone">
    <div class="screen">
      <div class="notch"></div>
      <div class="statusbar"><span>9:41</span><span>●●● 5G 🔋</span></div>
      <div id="screen-root"></div>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <div class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div class="brand"><div class="logo">BF</div><div class="brand-name">BPI Barkada <span>FUNd</span></div></div>
          <div class="icon-btn" id="closeSidebarBtn">✕</div>
        </div>
        <div class="sidebar-nav" id="sidebarNav"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- app state (drives the interactive screens) ---------- */
const state = {
  goalName: 'Boracay Trip',
  targetAmount: 30000,
  currentAmount: 18400,
  timeframe: 'medium', // 'short' | 'medium' | 'long' — locked to 'medium' for now
  shareAmounts: false, // off by default: activity is visible, exact contribution amounts are hidden
  members: [
    { name:'You', you:true },
    { name:'Andrea' },
    { name:'Jules' },
  ],
  contributions: [
    { amount: 2820.50, daysAgo: 95 }, // unlocked (past 90 days)
    { amount: 1000.00, daysAgo: 42 }, // still locked, 48 days left
  ]
};

const TIMEFRAMES = {
  short:  { label:'Short-Term',  sub:'1–2 yrs',   equities:100, fixed:0, money:0 },
  medium: { label:'Medium-Term', sub:'3–5 yrs',   equities:100, fixed:0, money:0 },
  long:   { label:'Long-Term',   sub:'5–10+ yrs', equities:100, fixed:0, money:0 },
};

const COLORS = ['#A6192E','#D9A441','#2F7A4D','#3B6EA5','#8A4EA6','#C46B2C'];
function colorFor(name){ let h=0; for(const c of (name||'?')) h=(h*31+c.charCodeAt(0))%COLORS.length; return COLORS[Math.abs(h)%COLORS.length]; }
function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase() || '?'; }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function money(n){ return '₱' + Number(n).toLocaleString('en-PH'); }
function moneyExact(n){ const hasCents = Math.round(Number(n)*100) % 100 !== 0; return '₱' + Number(n).toLocaleString('en-PH', hasCents ? {minimumFractionDigits:2, maximumFractionDigits:2} : {maximumFractionDigits:0}); }
function contributionsSummary(){
  const available = state.contributions.filter(c=>c.daysAgo>=90).reduce((sum,c)=>sum+c.amount, 0);
  const locked = state.contributions.filter(c=>c.daysAgo<90);
  const lockedTotal = locked.reduce((sum,c)=>sum+c.amount, 0);
  const soonest = locked.reduce((min,c)=> (!min || c.daysAgo>min.daysAgo) ? c : min, null);
  return { available, lockedTotal, soonest, soonestDaysLeft: soonest ? 90 - soonest.daysAgo : null };
}

function tabbarHtml(active){
  const tabs = [
    { id:'dashboard', icon:'🏠', label:'Home' },
    { id:'members',   icon:'🎯', label:'Barkada' },
    { id:'monitor',   icon:'💰', label:'Invest' },
    { id:'profile',   icon:'👤', label:'Profile' },
  ];
  return `<div class="tabbar">${tabs.map(t=>`<div class="tab ${t.id===active?'active':''}" ${t.id!=='profile'?`data-goto="${t.id}"`:''}>${t.icon}<br>${t.label}</div>`).join('')}</div>`;
}

/* ---------- screens ---------- */
const screens = [
  { id:'onboard', label:'Onboarding Quiz',
    render: () => `
      <div class="appbar"><div class="brand"><div class="logo">BF</div><div class="brand-name">BPI Barkada <span>FUNd</span></div></div><div class="icon-btn hamburger-btn">☰</div></div>
      <div class="content">
        <div class="progress-dots"><div class="done"></div><div class="done"></div><div></div><div></div></div>
        <div class="eyebrow">Question 2 of 4</div>
        <div class="quiz-q">What are you and your barkada saving toward?</div>
        <div class="opt"><span>A trip within 1–2 years</span><div class="radio"></div></div>
        <div class="opt sel"><span>A big purchase in 3–5 years</span><div class="radio"></div></div>
        <div class="opt"><span>Long-term growth, 5+ years</span><div class="radio"></div></div>
        <div class="opt"><span>Not sure yet</span><div class="radio"></div></div>
      </div>
      <div style="padding:14px 20px 14px;"><button class="btn" data-goto="goal">Continue</button></div>
      ${tabbarHtml(null)}
    `},

  { id:'goal', label:'Set Investment Goal',
    render: () => `
      <div class="appbar"><div class="brand"><div class="logo">BF</div><div class="brand-name">BPI Barkada <span>FUNd</span></div></div><div class="icon-btn hamburger-btn">☰</div></div>
      <div class="content">
        <div class="eyebrow">Set your goal</div>
        <div class="h2">What are you investing for?</div>
        <div class="why-box"><b>Why set a goal?</b> A named, shared goal turns investing into something concrete your barkada is working toward together — not just a number going up. Since the fund is fully equity-invested, your timeframe sets expectations for volatility and pacing, not a different bond/equity split — shorter horizons just mean less time to ride out swings before you need the money.</div>

        <div class="field-label">Goal name</div>
        <input class="text-field" id="goalNameInput" value="${escapeHtml(state.goalName)}" placeholder="e.g. Boracay Trip">

        <div class="field-label">Target amount</div>
        <div class="amount-field-wrap"><span>₱</span><input id="goalAmountInput" type="number" value="${state.targetAmount}" placeholder="30000"></div>

        <div class="field-label">Timeframe</div>
        <div class="timeframe-row" id="timeframeRow">
          <div class="tf-card sel" data-tf="medium">
            <div class="tf-name">${TIMEFRAMES.medium.label}</div>
            <div class="tf-sub">${TIMEFRAMES.medium.sub}</div>
          </div>
        </div>
        <p class="muted" style="margin-top:6px;">Short- and Long-Term pathways are coming soon — Medium-Term is available now.</p>

        <div class="goal-preview">
          <div class="gp-label">Preview</div>
          <div class="gp-name">🎯 ${escapeHtml(state.goalName || 'Untitled Goal')}</div>
          <div class="gp-amt">${money(state.targetAmount)} target · ${TIMEFRAMES[state.timeframe].label} · 100% equities</div>
        </div>
        <p class="muted" style="text-align:center;">NAVPS ₱100 at launch · ₱500 minimum per member</p>
      </div>
      <div style="padding:14px 20px 14px;"><button class="btn" data-goto="members">Save Goal</button></div>
      ${tabbarHtml('members')}
    `},

  { id:'members', label:'Add Members',
    render: () => `
      <div class="appbar"><div class="brand"><div class="logo">BF</div><div class="brand-name">BPI Barkada <span>FUNd</span></div></div><div class="icon-btn hamburger-btn">☰</div></div>
      <div class="content">
        <div class="eyebrow">Grow your barkada</div>
        <div class="h2">Invite friends to "${escapeHtml(state.goalName || 'your goal')}"</div>
        <p class="muted" style="margin-bottom:14px;">Target investors: groups of young (18-25), first-time Filipino investors — minimum 3 members per barkada.</p>

        <div class="invite-box">
          <div class="eyebrow" style="margin-bottom:2px;">Invite Code</div>
          <div class="invite-code">${inviteCode()}</div>
          <button class="btn secondary" id="copyInviteBtn" style="padding:10px;">Copy Invite Link</button>
        </div>

        <div class="field-label">Add a friend manually</div>
        <div class="add-member-row">
          <input class="text-field" id="memberNameInput" placeholder="Friend's name">
          <button class="add-btn" id="addMemberBtn">Add</button>
        </div>

        <div class="card">
          <div class="eyebrow">Barkada Members (${state.members.length}${state.members.length<3?' — need 3 minimum':''})</div>
          <div id="memberList">
            ${state.members.map((m,i)=>`
              <div class="member-row">
                <div class="member-av" style="background:${colorFor(m.name)}">${initials(m.name)}</div>
                <div class="member-name">${escapeHtml(m.name)} ${m.you?'<span class="member-you">(you)</span>':''}</div>
                ${!m.you ? `<button class="remove-btn" data-idx="${i}">×</button>` : ''}
              </div>
            `).join('')}
          </div>
          ${state.members.length<3?`<p class="muted" style="margin-top:8px; color:var(--red);">Add ${3-state.members.length} more member${3-state.members.length>1?'s':''} to start a barkada goal.</p>`:''}
          <div class="switch-row" id="shareAmountsRow" style="margin-top:12px; padding-top:12px; border-top:1px solid var(--hair); cursor:pointer;">
            <span style="font-size:12px; font-weight:800; max-width:230px;">Share my exact contribution amounts with the barkada</span>
            <div class="switch ${state.shareAmounts?'on':''}" id="shareAmountsSwitch"></div>
          </div>
        </div>

        <div class="toggle-row"><div class="t">One-time</div><div class="t on">Monthly auto-debit</div></div>
        <div class="keypad"><div class="key">1</div><div class="key">2</div><div class="key">3</div><div class="key">4</div><div class="key">5</div><div class="key">6</div><div class="key">7</div><div class="key">8</div><div class="key">9</div><div class="key">₱</div><div class="key">0</div><div class="key">⌫</div></div>
        <p class="muted" style="text-align:center;">Debited from BPI Savings •••• 4821</p>
        <p class="muted" style="text-align:center; margin-top:6px;">🔒 This ₱500 contribution unlocks 90 days from today — earlier contributions may already be free to withdraw.</p>
      </div>
      <div style="padding:14px 20px 14px;"><button class="btn" data-goto="monitor">Confirm ₱500 / month</button></div>

const SIDEBAR_ITEMS = [
  { id:'dashboard', icon:'🏠', label:'Home' },
  { id:'goal',      icon:'🎯', label:'Set Goal' },
  { id:'members',   icon:'👥', label:'Barkada Members' },
  { id:'monitor',   icon:'💰', label:'Portfolio' },
  { id:'buy',       icon:'➕', label:'Add Funds' },
  { id:'redeem',    icon:'🔄', label:'Redeem' },
];

function inviteCode(){
  const slug = (state.goalName||'GOAL').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4) || 'GOAL';
  return `${slug}-${state.timeframe.slice(0,2).toUpperCase()}26-JMA`;
}

let currentIdx = 0; // start at onboarding — the real first-time customer flow

const root = document.getElementById('screen-root');

function currentScreen(){ return screens[currentIdx]; }

function goToScreen(id){
  currentIdx = screens.findIndex(s=>s.id===id);
  renderScreen();
}

function renderScreen(){
  root.innerHTML = currentScreen().render();
  renderSidebar();
  wireScreenInteractions();
}

function renderSidebar(){
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = SIDEBAR_ITEMS.map(item=>`
    <div class="sidebar-item ${currentScreen().id===item.id?'active':''}" data-goto="${item.id}">
      <span class="si-icon">${item.icon}</span><span>${item.label}</span>
    </div>
  `).join('');
}

function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}

function wireScreenInteractions(){
  const id = currentScreen().id;

  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.onclick = ()=>{ goToScreen(el.dataset.goto); closeSidebar(); };
  });

  document.querySelectorAll('.hamburger-btn').forEach(btn=>{
    btn.onclick = openSidebar;
  });

  if (id === 'goal'){
    document.getElementById('goalNameInput').addEventListener('input', (e)=>{
      state.goalName = e.target.value;
      updatePreview();
    });
    document.getElementById('goalAmountInput').addEventListener('input', (e)=>{
      state.targetAmount = Number(e.target.value) || 0;
      updatePreview();
    });
  }

  if (id === 'members'){
    document.getElementById('addMemberBtn').onclick = addMember;
    document.getElementById('memberNameInput').addEventListener('keydown', (e)=>{
      if (e.key === 'Enter') addMember();
    });
    document.querySelectorAll('.remove-btn').forEach(btn=>{
      btn.onclick = ()=>{
        state.members.splice(Number(btn.dataset.idx), 1);
        renderScreen();
      };
    });
    document.getElementById('copyInviteBtn').onclick = async (e)=>{
      const btn = e.target;
      try{ await navigator.clipboard.writeText(inviteCode()); }catch(err){}
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(()=>btn.textContent = old, 1200);
    };
    document.getElementById('shareAmountsRow').onclick = ()=>{
      state.shareAmounts = !state.shareAmounts;
      document.getElementById('shareAmountsSwitch').classList.toggle('on', state.shareAmounts);
    };
  }
}

function addMember(){
  const input = document.getElementById('memberNameInput');
  const name = input.value.trim();
  if (!name) return;
  state.members.push({ name });
  input.value = '';
  renderScreen();
}

function updatePreview(){
  const box = document.querySelector('.goal-preview');
  if (!box) return;
  const tf = TIMEFRAMES[state.timeframe];
  box.querySelector('.gp-name').textContent = '🎯 ' + (state.goalName || 'Untitled Goal');
  box.querySelector('.gp-amt').textContent = `${money(state.targetAmount)} target · ${tf.label} pathway (${tf.equities}% equities)`;
}

document.getElementById('sidebarBackdrop').onclick = closeSidebar;
document.getElementById('closeSidebarBtn').onclick = closeSidebar;

renderScreen();
</script>
