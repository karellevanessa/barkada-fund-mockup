<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPI Barkada FUNd</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone-wrap">
  <div class="phone">
    <div class="screen">
      <div class="notch"></div>
      <div class="statusbar"><span>9:41</span><span>●●● 5G 🔋</span></div>
      <div id="screen-root"></div>
      <div class="toast-stack" id="toastStack"></div>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <div class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div class="brand"><div class="logo">BF</div><div class="brand-name">BPI Barkada <span>FUNd</span></div></div>
          <div class="icon-btn" id="closeSidebarBtn">✕</div>
        </div>
        <div class="sidebar-nav" id="sidebarNav"></div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
